# Local stack. Requires a .env file next to this one (copy .env.example).

x-app-env: &app-env
  DOCFLOW_ENVIRONMENT: docker
  DOCFLOW_DATABASE_URL: postgresql+psycopg://docflow:docflow@db:5432/docflow
  DOCFLOW_JWT_SECRET: ${DOCFLOW_JWT_SECRET:?Set DOCFLOW_JWT_SECRET in .env (see .env.example)}
  DOCFLOW_REDIS_URL: redis://redis:6379/0
  DOCFLOW_S3_ENDPOINT_URL: http://storage:8333
  # Local-only credentials for the S3-compatible server; on AWS the IAM role is used instead.
  AWS_ACCESS_KEY_ID: docflow-local
  AWS_SECRET_ACCESS_KEY: docflow-local-secret
  # Empty when unset (as in CI): extraction then fails with a clear reason instead of calling OpenAI.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # LOCAL ONLY: lets webhooks reach the mock receiver over http inside Docker. This disables the
  # SSRF protection and must never be set in production.
  DOCFLOW_WEBHOOK_ALLOW_PRIVATE_TARGETS: "true"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created: adds the docflow_test database.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible object storage for local development (SeaweedFS; MinIO stopped publishing
  # free images in 2025). Production uses AWS S3 with the same code.
  storage:
    image: chrislusf/seaweedfs:4.52
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: docflow-local
      AWS_SECRET_ACCESS_KEY: docflow-local-secret
    ports:
      - "8333:8333"
    volumes:
      - objectdata:/data

  # Runs migrations and creates the bucket once, then exits. The API and worker only start
  # if this succeeds, so several replicas never race to migrate the same database.
  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m docflow.cli init-storage"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: on-failure:5 # the storage server may need a few seconds before it accepts requests

  api:
    build: .
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["celery", "-A", "docflow.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery beat: triggers webhook dispatch every few seconds; the worker does the sending.
  scheduler:
    build: .
    command: ["celery", "-A", "docflow.worker", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # HTTPS in front of the API, same Caddyfile as production: https://localhost:8443
  proxy:
    image: caddy:2.11.8
    environment:
      DOCFLOW_SITE_ADDRESS: localhost
    ports:
      - "8443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

  # Mock customer system for local development and the smoke test (scripts/webhook_receiver.py).
  receiver:
    image: python:3.13-slim
    command: ["python", "/app/webhook_receiver.py"]
    volumes:
      - ./scripts/webhook_receiver.py:/app/webhook_receiver.py:ro
    ports:
      - "9000:9000"

volumes:
  pgdata:
  objectdata:
