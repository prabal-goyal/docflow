name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow
          POSTGRES_DB: docflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docflow -d docflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DOCFLOW_DATABASE_URL: postgresql+psycopg://docflow:docflow@localhost:5432/docflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests alembic evals
      - name: Migrations apply, match the models and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with a throwaway secret
        run: echo "DOCFLOW_JWT_SECRET=$(openssl rand -base64 48)" > .env
      - name: Start the full stack and wait for health checks
        run: docker compose up --build --detach --wait
      - name: Health checks
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready
      - name: End-to-end smoke test (upload -> queue -> worker)
        run: bash scripts/smoke_test.sh
      - name: Production hardening (HTTPS proxy, size cap, JSON logs, rate limit, backup/restore)
        run: bash scripts/verify_hardening.sh
      - name: Production compose file is valid
        run: AWS_REGION=ap-south-1 DOCFLOW_IMAGE=x DOCFLOW_SITE_ADDRESS=y docker compose -f deploy/docker-compose.prod.yml config --no-interpolate > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  # Deploys main to AWS once every check has passed. AWS access comes from GitHub's OIDC token:
  # no AWS keys are stored in GitHub. The role only trusts this repository's main branch.
  deploy:
    runs-on: ubuntu-latest
    needs: [checks, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never interrupt a deploy half-way
    environment:
      name: production
      url: https://${{ vars.DOCFLOW_HOSTNAME }}
    permissions:
      id-token: write # to request the OIDC token
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE: ${{ vars.DOCFLOW_ECR_REPOSITORY }}:${{ github.sha }}
      BUNDLE: s3://${{ vars.DOCFLOW_BUCKET }}/deploy/${{ github.sha }}/
      INSTANCE_ID: ${{ vars.DOCFLOW_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and push the image (tagged with the commit)
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE%%/*}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Upload the deploy bundle
        run: aws s3 cp deploy/ "$BUNDLE" --recursive --exclude "*" --include "docker-compose.prod.yml" --include "Caddyfile" --include "*.sh"
      - name: Deploy on the server through SSM (no SSH)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":[\"aws s3 cp $BUNDLE /opt/docflow/ --recursive --only-show-errors\",\"AWS_REGION=$AWS_REGION bash /opt/docflow/remote-deploy.sh $IMAGE\"],\"executionTimeout\":[\"900\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command $COMMAND_ID"
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text
          [[ "$STATUS" == "Success" ]] || { echo "Deploy finished with status $STATUS"; exit 1; }
      - name: Check the live service over HTTPS
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "https://${{ vars.DOCFLOW_HOSTNAME }}/ready" && exit 0
            sleep 5
          done
          exit 1
